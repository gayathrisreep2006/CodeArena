{% extends "base.html" %}

{% block body_class %}page-problem-delete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 text-center">
  <h2>Delete "{{ problem.title }}"?</h2>
  <p class="text-muted">This also deletes its test cases and submissions.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'problems:detail' problem.pk %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
