{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}CodeArena{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    {% block extra_css %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 {% block body_class %}page-default{% endblock %}">

    {% include "partials/navbar.html" %}

    <main class="container py-4 flex-grow-1">
        {% include "partials/messages.html" %}
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3 border-top small">
        CodeArena &middot; Full Stack Development Mini Project
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
